<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
      .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #818cf8; }
      
      @keyframes pulseNode {
        0%, 100% { r: 6px; opacity: 0.8; }
        50% { r: 10px; opacity: 1; stroke: #c084fc; stroke-width: 2; }
      }
      
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      
      @keyframes floatPill {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      
      .node-1 { animation: pulseNode 3s infinite ease-in-out; }
      .node-2 { animation: pulseNode 3s infinite ease-in-out 1s; }
      .node-3 { animation: pulseNode 3s infinite ease-in-out 2s; }
      .flow-line { stroke-dasharray: 8 8; animation: dashFlow 2s linear infinite; }
      .floating-card { animation: floatPill 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-gradient)" />

  <!-- Background Animated Network / Grid (Stays in background behind text) -->
  <g opacity="0.25">
    <path d="M 100 50 Q 300 250 600 120 T 1100 220" fill="none" stroke="#818cf8" stroke-width="2" class="flow-line" />
    <path d="M 50 220 Q 400 80 800 260 T 1150 80" fill="none" stroke="#c084fc" stroke-width="1.5" class="flow-line" />
    
    <circle cx="200" cy="115" r="7" fill="#818cf8" class="node-1" />
    <circle cx="450" cy="180" r="7" fill="#c084fc" class="node-2" />
    <circle cx="750" cy="100" r="7" fill="#f472b6" class="node-3" />
    <circle cx="980" cy="210" r="7" fill="#818cf8" class="node-1" />
  </g>

  <!-- Side Floating Decorative Card (Positioned to right so text remains clear) -->
  <g transform="translate(860, 60)" class="floating-card">
    <rect width="280" height="200" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.9" />
    <rect x="20" y="24" width="120" height="12" rx="6" fill="#334155" />
    <rect x="20" y="48" width="220" height="8" rx="4" fill="#1e293b" />
    <rect x="20" y="64" width="180" height="8" rx="4" fill="#1e293b" />
    
    <!-- Visual Graph Element -->
    <path d="M 20 160 L 70 130 L 120 145 L 170 100 L 220 115 L 250 80" fill="none" stroke="url(#accent-grad)" stroke-width="3" />
    <circle cx="250" cy="80" r="4" fill="#f472b6" />
    <circle cx="170" cy="100" r="4" fill="#c084fc" />
  </g>

  <!-- Foreground Content Block (Guaranteed foreground visibility) -->
  <g transform="translate(60, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 50)">
      <rect width="270" height="32" rx="16" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
      <text x="16" y="21" class="badge-text">⚡ AI &amp; RECOMMENDATION ENGINES</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" class="title" filter="url(#glow)">Awesome AI Personalization Engine 🚀</text>

    <!-- Gradient Bar -->
    <rect x="0" y="160" width="520" height="4" rx="2" fill="url(#accent-grad)" />

    <!-- Subtitle -->
    <text x="0" y="200" class="subtitle">Curated SaaS Platforms &amp; Open-Source Recommender Systems</text>
    <text x="0" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">Real-Time Recommendations • Contextual Bandits • Reinforcement Learning • Collaborative Filtering</text>
  </g>
</svg>
